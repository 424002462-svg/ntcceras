{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200/80">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-black text-[#0B1B6D]">System Sign In</h2>
      <p class="text-xs text-slate-500 mt-1">Access your campus account</p>
    </div>
    
    <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Student ID or Admin Username</label>
        <input type="text" name="username" required placeholder="e.g. 42400001 or Admin1" class="block w-full px-4 py-3 text-sm border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-[#0B1B6D] focus:border-[#0B1B6D] outline-none transition">
      </div>
      
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="block w-full px-4 py-3 text-sm border border-slate-300 rounded-xl shadow-sm focus:ring-2 focus:ring-[#0B1B6D] focus:border-[#0B1B6D] outline-none transition">
      </div>

      <button type="submit" class="w-full bg-[#0B1B6D] text-white py-3 rounded-xl font-bold text-sm shadow-md hover:bg-[#061043] hover:shadow-lg transition duration-200">
        Sign In to Portal
      </button>
    </form>

    <div class="mt-8 p-4 bg-slate-50 rounded-xl border border-slate-200/80 text-xs text-slate-700 space-y-1.5">
      <p class="font-bold text-[#0B1B6D] uppercase tracking-wider mb-2">Demo Login Credentials:</p>
      <p><strong>Student ID:</strong> <code class="bg-white px-2 py-0.5 rounded border border-slate-200 text-[#0B1B6D] font-mono">42400001</code></p>
      <p><strong>Password:</strong> <code class="bg-white px-2 py-0.5 rounded border border-slate-200 text-[#0B1B6D] font-mono">newStudent1</code></p>
      <div class="border-t border-slate-200 my-2 pt-2"></div>
      <p><strong>Admin Username:</strong> <code class="bg-white px-2 py-0.5 rounded border border-slate-200 text-[#0B1B6D] font-mono">Admin1</code></p>
      <p><strong>Password:</strong> <code class="bg-white px-2 py-0.5 rounded border border-slate-200 text-[#0B1B6D] font-mono">admin123</code></p>
    </div>
  </div>
</div>
{% endblock %}
